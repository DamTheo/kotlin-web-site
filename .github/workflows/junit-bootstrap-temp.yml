name: JUnit bootstrap temp

on:
  pull_request:
    branches: [master]

jobs:
  junit:
    runs-on: ubuntu-latest
    steps:
      - name: Download test jars
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/junit"
          curl -fsSL -o "$RUNNER_TEMP/junit/junit-4.13.2.jar" https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL -o "$RUNNER_TEMP/junit/hamcrest-core-1.3.jar" https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          sha256sum "$RUNNER_TEMP/junit/"*.jar
      - name: Upload test jars
        uses: actions/upload-artifact@v4
        with:
          name: junit-v152
          path: ${{ runner.temp }}/junit
          retention-days: 1
